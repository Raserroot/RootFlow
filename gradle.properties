# RootFlow Gradle properties.
#
# ASCII-ONLY FILE - see AGENT_PROTOCOL.md "Environment deviations".
# Windows tools (cmd.exe and the JVM launcher) read this file using the OEM
# code page (GBK on this host), so UTF-8 Chinese comments render as mojibake
# (for example the header line "Gradle <Chinese>" prints as garbage). Keep every
# comment in this file in English.

# Gradle daemon.
# -Dfile.encoding=UTF-8 keeps console output UTF-8 regardless of host code page.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The sandbox forbids the native file-event watcher from opening the current
# thread ("Couldn't open current thread, error = 5"). Polling is slower but works.
org.gradle.vfs.watch=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# NOTE: org.gradle.java.home is intentionally NOT set here. Gradle 8.14.5 must
# run on JDK 21; this host also has JDK 25 installed, and Gradle's embedded
# Kotlin 2.0.21 cannot parse the "25.0.2" version string (the build fails during
# .gradle.kts compilation with IllegalArgumentException: 25.0.2). Pinning an
# absolute JAVA_HOME in this file would hard-code a machine-specific path into
# the repository, so the requirement is enforced by build.cmd instead.
